name: Build and deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"
          IMAGE="$LOGIN_SERVER/tasks:$GITHUB_SHA"
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "registry=https://$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure App Service
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --settings WEBSITES_PORT=8080 WEBSITES_ENABLE_APP_SERVICE_STORAGE=true DataDirectory=/home/data \
            --output none
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE" --container-registry-url "$REGISTRY" \
            --output none
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"